name: CI

# Roda a cada push e a cada pull request: confere o código, roda os testes e gera o build.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Verificar o código (ESLint)
        run: npm run lint

      - name: Rodar os testes (Vitest)
        run: npm test

      - name: Gerar o build de produção
        run: npm run build
